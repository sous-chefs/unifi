---
driver:
  name: vagrant
  customize:
    memory: 4096
    cpus: 2
provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  chef_license: accept-no-persist
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true
  policyfile: Policyfile.rb
verifier:
  name: inspec
platforms:
  - name: ubuntu-24.04
  - name: debian-13
suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier:
      inspec_tests:
        - path: test/integration/default
